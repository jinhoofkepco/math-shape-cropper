name: Python check

on:
  push:
  pull_request:

jobs:
  py-compile:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile sources
        run: python -m py_compile run_app.py shape_cropper/app.py shape_cropper/image_processing.py

